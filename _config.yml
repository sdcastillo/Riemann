# SamWiki skin on Cayman for this project Pages site.
# Theme setup follows GitHub's Jekyll theme guide:
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# Pin: remote_theme pages-themes/cayman@v0.2.0
# Skin files: assets/css/style.scss, _layouts/default.html,
# _includes/head-custom.html, _includes/samwiki-nav.html
# Pages opt in with front matter `samwiki: true`.

title: Riemann
description: Notes on the zeta function, its zeros, and the critical line, with the P versus NP slides kept alongside.
remote_theme: pages-themes/cayman@v0.2.0
url: https://sdcastillo.github.io
baseurl: /Riemann
samwiki: true
show_downloads: false
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
